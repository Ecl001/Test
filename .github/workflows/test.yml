name: Download Drive File

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Install gdown
        run: pip install -U gdown

      - name: Download
        run: |
          gdown "https://drive.google.com/uc?id=1trA4aQl-g3EBxOhA7Y_aAR_mQEIUjRJx" -O solstice.obb

      - name: Check
        run: ls -lh solstice.obb